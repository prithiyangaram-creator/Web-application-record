<!DOCTYPE html>
<html>
<head>
  <title>Modern React Registration</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 380px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      color: #4f46e5;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #6366f1;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    .error {
      color: #dc2626;
      font-size: 13px;
    }

    .success {
      color: #16a34a;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Registration() {

  const [data, setData] = React.useState({
    username: "",
    email: "",
    password: ""
  });

  const [error, setError] = React.useState("");
  const [success, setSuccess] = React.useState("");

  function changeHandler(e) {
    setData({
      ...data,
      [e.target.name]: e.target.value
    });

    setError("");
  }

  function submitHandler(e) {
    e.preventDefault();

    if (!data.username ||
        !data.email ||
        !data.password) {

      setError("Please fill all fields");
      setSuccess("");
      return;
    }

    if (data.password.length < 8) {
      setError("Password must contain at least 8 characters");
      setSuccess("");
      return;
    }

    setError("");
    setSuccess("Account created successfully!");

    setData({
      username: "",
      email: "",
      password: ""
    });
  }

  return (
    <div className="card">

      <h1>Create Account</h1>

      <form onSubmit={submitHandler}>

        <label>Username</label>

        <input
          type="text"
          name="username"
          value={data.username}
          onChange={changeHandler}
          placeholder="Enter username"
        />

        <label>Email</label>

        <input
          type="email"
          name="email"
          value={data.email}
          onChange={changeHandler}
          placeholder="Enter email"
        />

        <label>Password</label>

        <input
          type="password"
          name="password"
          value={data.password}
          onChange={changeHandler}
          placeholder="Enter password"
        />

        {error && (
          <p className="error">{error}</p>
        )}

        <button type="submit">
          Create Account
        </button>

        {success && (
          <p className="success">{success}</p>
        )}

      </form>

    </div>
  );
}

function App() {
  return <Registration />;
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
