<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>

    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 36px;
        }

        .content {
            padding: 30px;
        }

        h2 {
            color: #0066cc;
            font-family: "Trebuchet MS", sans-serif;
        }

        p {
            color: #333333;
            font-size: 18px;
            font-family: Verdana, sans-serif;
        }

        .highlight {
            color: red;
            font-weight: bold;
        }

        footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College</h1>
        <p style="color:white;">Education for a Better Future</p>
    </header>

    <div class="content">

        <h2>About Our College</h2>

        <p>
            ABC College provides <span class="highlight">
            quality education</span> to students.
        </p>

        <h2>Departments</h2>

        <p>Computer Science</p>
        <p>Information Technology</p>
        <p>Mechanical Engineering</p>

    </div>

    <footer>
        © 2026 ABC College
    </footer>

</body>
</html>
