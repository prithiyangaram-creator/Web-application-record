<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .header h1 {
            color: #00bcd4;
            font-family: Georgia, serif;
            font-size: 40px;
        }

        .header p {
            font-size: 20px;
            color: #dddddd;
        }

        .card {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .card h2 {
            color: #673ab7;
            font-family: Georgia, serif;
        }

        .card p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .skill {
            color: white;
            background-color: #673ab7;
            padding: 8px 15px;
            margin: 5px;
            display: inline-block;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>My Portfolio</h1>
        <p>Web Developer & Designer</p>
    </div>

    <div class="card">

        <h2>About Me</h2>

        <p>
            Hello! I am a student interested in
            <b>web development</b> and software design.
        </p>

        <h2>My Skills</h2>

        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JavaScript</span>
        <span class="skill">Python</span>

    </div>

    <div class="footer">
        © 2026 My Portfolio
    </div>

</body>
</html>
