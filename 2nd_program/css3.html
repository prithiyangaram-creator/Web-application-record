<!DOCTYPE html>
<html>
<head>
    <title>Restaurant</title>

    <style>
        body {
            background-color: #fff3e0;
            font-family: Verdana, sans-serif;
        }

        h1 {
            color: white;
            background-color: #e65100;
            text-align: center;
            padding: 25px;
        }

        h2 {
            color: #d84315;
            font-family: Georgia, serif;
        }

        .menu {
            background-color: white;
            border: 2px solid #ff9800;
            padding: 20px;
            margin: 20px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        p {
            font-size: 17px;
        }
    </style>
</head>

<body>

    <h1>🍴 Delicious Restaurant</h1>

    <div class="menu">
        <h2>Pizza</h2>
        <p>Cheese Pizza</p>
        <p class="price">₹250</p>

        <h2>Burger</h2>
        <p>Veg Burger</p>
        <p class="price">₹150</p>

        <h2>Biryani</h2>
        <p>Chicken Biryani</p>
        <p class="price">₹250</p>
    </div>

</body>
</html>
